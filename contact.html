<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contact | Free 15-Minute Consultation with Captain Arlan Stagg</title>
<meta name="description" content="Request a free 15-minute consultation with Captain Arlan Stagg about captain services, yacht management, owner training, charters, deliveries, boat buying or wedding ceremonies on San Francisco Bay.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&amp;family=Raleway:wght@400;500;700&amp;family=Source+Sans+Pro:wght@300;400;700&amp;family=Montserrat:wght@500;700&amp;family=PT+Serif:ital@0;1&amp;display=swap">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body data-page="contact">
<a class="skip" href="#main">Skip to content</a>
<header id="site-head"></header>
<main id="main">
<section class="contact-hero" style="background-image:url(img/g-bay-bridge-helm.jpg)">
  <div class="row1080"><p class="ch-title" role="heading" aria-level="1">Get in touch with Captain Arlan.</p></div>
</section>
<section class="contact-main" id="consult">
  <span id="wedding"></span>
  <div class="row1080 cgrid">
    <div class="c-left">
      <p class="c-ask">Are you in need of any of our services? Please get in touch!</p>
      <div class="c-info" data-needs-contact>
        <div><h3>Telephone</h3><a data-phone href="#"><span data-phone-text></span></a></div>
        <div><h3>Email</h3><a data-email href="#"><span data-email-text></span></a></div>
      </div>
    </div>
    <form class="cform" id="consult-form" novalidate>
      <h1 class="cf-title">Contact Captain Arlan Stagg</h1>
      <div class="two">
        <div class="field"><label class="sr" for="f-name">Name</label><input id="f-name" name="name" placeholder="Name" autocomplete="name" required><span class="err" id="f-name-err"></span></div>
        <div class="field"><label class="sr" for="f-email">Email</label><input id="f-email" name="email" type="email" placeholder="Email" autocomplete="email" required><span class="err" id="f-email-err"></span></div>
      </div>
      <div class="field"><label class="sr" for="f-phone">Phone</label><input id="f-phone" name="phone" type="tel" placeholder="Phone" autocomplete="tel"></div>
      <input type="hidden" id="f-service" name="service" value="">
      <div class="field"><label class="sr" for="f-message">Message</label><textarea id="f-message" name="message" placeholder="Message" required></textarea><span class="err" id="f-message-err"></span></div>
      <div class="hp" aria-hidden="true"><label for="f-company">Company</label><input id="f-company" name="company" tabindex="-1" autocomplete="off"></div>
      <div class="submit-row">
        <label for="f-check"><span data-sum></span> =</label><input id="f-check" name="check" inputmode="numeric" autocomplete="off">
        <button class="btn-submit" type="submit">Submit</button>
      </div>
      <span class="err" id="f-check-err"></span>
      <p class="status info" role="status" aria-live="polite" hidden></p>
    </form>
  </div>
</section>
</main>
<footer id="site-foot"></footer>
<script src="app.js"></script>
</body>
</html>
